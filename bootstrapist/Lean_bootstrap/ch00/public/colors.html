<!DOCTYPE html>
<html lang="en">
    <head>
    <!-- Required meta tags always come first -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title></title>

        <!-- Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
        >
    </head>
    <body class="p-2">
        <div>
        <h1 class="display-1">Bootstrap Colors</h1>
        <h2 class="display-2 fs-4 fw-bolder">Standard Colors</h2>
        <div class="row border border-dark">
            <div class="col-sm-4 bg-primary text-white">Primary</div>
            <div class="col-sm-4 bg-secondary text-white">Secondary</div>
            <div class="col-sm-4 bg-success text-white">Success</div>
        </div>
        <div class="row border border-dark">
            <div class="col-sm-4 bg-danger text-white">Danger</div>
            <div class="col-sm-4 bg-warning text-dark">Warning</div>
            <div class="col-sm-4 bg-info text-dark">Info</div>
        </div>
        <div class="row border border-dark">
            <div class="col-sm-6 bg-dark text-white">Dark</div>
            <div class="col-sm-6 bg-light text-dark">Light</div>
        </div>
        </div>
        <div>
        <div class="row border border-dark m-2">
            <div class="col-sm-4 bg-primary text-white">Primary</div>
            <div class="col-sm-4 bg-secondary text-white">Secondary</div>
            <div class="col-sm-4 bg-success text-white">Success</div>
        </div>
        <div class="row border border-dark m-2">
            <div class="col-sm-4 bg-danger text-white">Danger</div>
            <div class="col-sm-4 bg-warning text-dark">Warning</div>
            <div class="col-sm-4 bg-info text-dark">Info</div>
        </div>
        <div class="row border border-dark m-2">
            <div class="col-sm-6 bg-dark text-white">Dark</div>
            <div class="col-sm-6 bg-light text-dark">Light</div>
        </div>
        </div>
        <!-- Bootstrap JS. -->
        <script
            src=https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js>
        </script>
    </body>
</html>
