<!DOCTYPE html>
<html lang="en">
    <head>
    <!-- Required meta tags always come first -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Bootstrap Buttons</title>

        <!-- Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
        >
    </head>
    <body class="p-2">
        <div class="mb-3">
            <h1>Bootstrap Buttons</h1>
        <div>
            <button type="button" class="btn btn-primary">Primary </button>
            <button type="button" class="btn btn-secondary">Secondary</button>
            <button type="button" class="btn btn-success">Success</button>
            <button type="button" class="btn btn-danger">Danger</button>
            <button type="button" class="btn btn-warning">Warning</button>
            <button type="button" class="btn btn-info">Info</button>
            <button type="button" class="btn btn-light">Light</button>
            <button type="button" class="btn btn-dark">Dark</button>
            <button type="button" class="btn btn-link text-decoration-none">Link</button>
        </div>
        <div class="mt-3 btn-group">
            <button type="button" class="btn btn-primary">Left</button>
            <button type="button" class="btn btn-success">Middle</button>
            <button type="button" class="btn btn-warning">Right</button>
        </div>
        </div>
        <div class="mt-3">
            <h2>Outlined Buttons</h2>
            <div>
                <button type="button" class="btn btn-outline-primary">Primary </button>
                <button type="button" class="btn btn-outline-secondary">Secondary</button>
                <button type="button" class="btn btn-outline-success">Success</button>
                <button type="button" class="btn btn-outline-danger">Danger</button>
                <button type="button" class="btn btn-outline-warning">Warning</button>
                <button type="button" class="btn btn-outline-info">Info</button>
                <button type="button" class="btn btn-outline-light text-dark">Light</button>
                <button type="button" class="btn btn-outline-dark">Dark</button>
                <button type="button" class="btn btn-outline-link text-decoration-none">Link</button>
            </div>
            <div class="mt-3 btn-group">
                <button type="button" class="btn btn-outline-primary">Left</button>
                <button type="button" class="btn btn-outline-success">Middle</button>
                <button type="button" class="btn btn-outline-warning">Right</button>
            </div>
        </div>
        <!-- Bootstrap JS. -->
        <script
            src=https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js>
        </script>
    </body>
</html>
