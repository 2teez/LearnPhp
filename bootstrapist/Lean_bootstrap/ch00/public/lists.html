<!DOCTYPE html>
<html lang="en">
    <head>
    <!-- Required meta tags always come first -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Lists - Bootstrap</title>

        <!-- Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
        >
    </head>
    <body class="p-2">
        <h4 class="display-4">Lists</h4>
        <h5 class="display-5"><small class="text-muted">Unstyled List</small></h5>
        <div class="text-start">
            <ul class="fs-5">
                <li>Java</li>
                <li>Python</li>
                <li>PHP</li>
            </ul>
        </div>

        <h5 class="display-5"><small class="text-muted">Inline List</small></h5>
        <div class="text-start">
            <ul class="fs-5 list-inline">
                <li class="list-inline-item"> | <a href="#" class="text-decoration-none">Java</a> | </li>
                <li class="list-inline-item">  <a href="#" class="text-decoration-none">Python</a> | </li>
                <li class="list-inline-item">  <a href="#" class="text-decoration-none">PHP</a> | </li>
            </ul>
        </div>
        <!-- Bootstrap JS. -->
        <script
            src=https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js>
        </script>
    </body>
</html>
